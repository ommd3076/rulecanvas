name: Verify RuleCanvas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rulecanvas_test
          POSTGRES_PASSWORD: rulecanvas_ci_only
          POSTGRES_DB: rulecanvas_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U rulecanvas_test -d rulecanvas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm exec -- tsc --noEmit
      - run: npm run build
      - run: npm test
        env:
          RULECANVAS_TEST_DATABASE_URL: postgresql://rulecanvas_test:rulecanvas_ci_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rulecanvas_test
