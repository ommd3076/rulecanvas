name: Verify RuleCanvas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rulecanvas_test
          POSTGRES_PASSWORD: rulecanvas_ci_only
          POSTGRES_DB: rulecanvas_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U rulecanvas_test -d rulecanvas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm exec -- tsc --noEmit
      - run: npm run build
      - run: npm test
        env:
          RULECANVAS_TEST_DATABASE_URL: postgresql://rulecanvas_test:rulecanvas_ci_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/rulecanvas_test
      - name: Build and verify hosted container
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker build --tag rulecanvas-ci .
          network=$(docker inspect --format '{{range $name, $config := .NetworkSettings.Networks}}{{$name}}{{end}}' "$POSTGRES_CONTAINER")
          secret=$(node -p "require('node:crypto').randomBytes(32).toString('base64url')")
          container=$(docker run --detach --network "$network" --publish 127.0.0.1::4178 \
            --env RULECANVAS_DATABASE_URL=postgresql://rulecanvas_test:rulecanvas_ci_only@postgres:5432/rulecanvas_test \
            --env RULECANVAS_ASSERTION_ISSUER=ci-proxy \
            --env RULECANVAS_ASSERTION_AUDIENCE=rulecanvas \
            --env "RULECANVAS_ASSERTION_SECRET=$secret" rulecanvas-ci)
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          address=$(docker port "$container" 4178/tcp)
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 "http://$address/health/ready"
          curl --fail --silent --show-error "http://$address/" | grep -F '<div id="root">'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "http://$address/api/projects")" = 401
